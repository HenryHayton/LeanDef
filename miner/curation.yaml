  # on 6 names, not a coded miner gate; re-evaluate if this class surfaces at meaningful scale
  # in a wider harvest -- docs/deferred.md carries the trigger.) All 6 originally hit the
  # batch-50 preflight's pretty-printer proof-elision exclusion (printed type contains an
  # unparseable `⋯`); a 29 July characterization session showed that failure is recoverable
  # (pp.proofs true re-elaborates all 6 cleanly), so it is NOT the real reason these stay
