[project]
name = "definition-verifier"
version = "0.0.1"
description = "A kernel-adjudicated faithfulness signal for Lean 4 definitions"
requires-python = ">=3.11"
dependencies = [
    "lean-interact",
    "pytest",
    "ruff",
    "pyyaml",
    "boto3",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
markers = [
    "box_only: needs the EC2 hammer box's Lean/Hammer environment (docs/ec2_runbook.md Phase G.4); deselected on the Mac.",
]
