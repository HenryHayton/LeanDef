[project]
name = "definition-verifier"
version = "0.0.1"
description = "A kernel-adjudicated faithfulness signal for Lean 4 definitions"
requires-python = ">=3.11"
dependencies = [
    "lean-interact",
    "pytest",
    "ruff",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
